<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Festisolde | Mode & Accessoires</title>

    <script>
      (function() {
        const hostname = window.location.hostname;
        const isVendor = hostname.startsWith('vendeur.');
        
        // Sélection du manifest
        const manifestPath = isVendor ? '/manifest-vendeur.json' : '/manifest.json';
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestPath;
        document.head.appendChild(link);
        
        // Adaptation du titre et de la couleur de thème pour le Studio
        if (isVendor) {
          document.title = "FestiSolde Studio | Dashboard";
          // On peut aussi changer la meta theme-color dynamiquement
          const metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.setAttribute('content', '#000000');
        }
      })();
    </script>

    <meta name="theme-color" content="#e11d48" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FestiSolde" />

    <meta name="description" content="La première plateforme de déstockage et liquidation certifiée au Burkina Faso." />
  </head>
  <body>
    <div id="root"></div>
    
    <script src="https://cdn.fedapay.com/checkout.js?v=1.1.7"></script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
