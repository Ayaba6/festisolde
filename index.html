<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FestiSolde — Les bonnes affaires du Burkina, en direct des vendeurs</title>

    <script>
      (function() {
        const hostname = window.location.hostname;
        const isVendor = hostname.startsWith('vendeur.');

        // Sélection du manifest
        const manifestPath = isVendor ? '/manifest-vendeur.json' : '/manifest.json';
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestPath;
        document.head.appendChild(link);

        // Adaptation du titre et de la couleur de thème pour le Studio
        if (isVendor) {
          document.title = "FestiSolde Studio | Dashboard";
          const metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.setAttribute('content', '#000000');
        }
      })();
    </script>

    <meta name="theme-color" content="#ea580c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FestiSolde" />

    <meta name="description" content="Déstockage, promotions et vente en gros au Burkina Faso. Achetez en direct auprès des vendeurs, payez par Orange Money, Moov Money ou à la livraison." />

    <!-- Aperçu des liens partagés (WhatsApp, Facebook…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FestiSolde" />
    <meta property="og:title" content="FestiSolde — Les bonnes affaires du Burkina" />
    <meta property="og:description" content="Déstockage, promotions et vente en gros, en direct des vendeurs. Paiement Orange Money, Moov Money ou à la livraison." />
    <meta property="og:image" content="https://festisolde.com/og-default.jpg" />
    <meta property="og:locale" content="fr_FR" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
